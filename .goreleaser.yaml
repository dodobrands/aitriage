# ==============================================================================
# AITriage — GoReleaser Configuration
# ==============================================================================
# Used by `make release` (a host-only snapshot build) and validated by
# `goreleaser check` in .github/workflows/ci.yml. Tag releases do NOT use this
# file: .github/workflows/release.yml builds each platform natively, because
# tree-sitter needs CGO.
# ==============================================================================

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: aitriage
    main: ./cmd/aitriage
    binary: aitriage
    env:
      # tree-sitter bindings do not compile without CGO.
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: "🔒 Security"
      regexp: '^.*?(feat|fix)\(security\).*$'
      order: 0
    - title: "🚀 Features"
      regexp: '^.*?feat(\(.+\))?!?:.*$'
      order: 1
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\(.+\))?!?:.*$'
      order: 2
    - title: "📦 Other"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

# ── Release Notes ─────────────────────────────────────────────────────────────
release:
  github:
    owner: dodobrands
    name: aitriage
  name_template: "AITriage v{{ .Version }}"
  header: |
    ## AITriage v{{ .Version }}

    Deterministic security scanner for AI-generated codebases, with optional AI triage.

    ### Install
    ```bash
    # macOS / Linux (official release + checksum verification + scanner setup)
    curl -fsSL https://github.com/dodobrands/aitriage/releases/latest/download/install.sh | sh

    # Go
    go install github.com/dodobrands/aitriage/cmd/aitriage@v{{ .Version }}

    # Binary download — see assets below
    ```
  footer: |
    **Full Changelog**: https://github.com/dodobrands/aitriage/compare/{{ .PreviousTag }}...{{ .Tag }}
