name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    # A tag alone must not let another collaborator create release artifacts.
    if: github.actor_id == '184216056'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: aitriage
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary_name: aitriage
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: aitriage
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: aitriage
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: aitriage.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded Web UI
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Stage Web UI for Go embedding
        shell: bash
        run: node -e "const fs=require('fs'); fs.rmSync('internal/server/ui/dist',{recursive:true,force:true}); fs.cpSync('web/dist','internal/server/ui/dist',{recursive:true})"

      - name: Set up MSYS2 (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/${{ matrix.binary_name }} ./cmd/aitriage

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -v -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o dist/${{ matrix.binary_name }} ./cmd/aitriage

      - name: Verify embedded release version
        shell: bash
        run: |
          actual=$(dist/${{ matrix.binary_name }} version)
          expected="AITriage ${{ github.ref_name }}"
          test "$actual" = "$expected" || {
            echo "Expected '$expected', got '$actual'" >&2
            exit 1
          }

      - name: Vet and test native Windows code
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
        run: |
          go vet ./...
          go test ./...

      # Publish gate: the PowerShell installer must pass its own tests under both
      # Windows PowerShell 5.1 and PowerShell 7 before any Windows asset ships. A
      # failure fails this build job, so the dependent release job never runs.
      - name: PowerShell installer tests (Windows PowerShell 5.1)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\install_windows_test.ps1

      - name: PowerShell installer tests (PowerShell 7)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\install_windows_test.ps1

      - name: Native Windows CLI process tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\windows_process_test.ps1 -AitriageBin .\dist\aitriage.exe

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          $cleanVersion = '${{ github.ref_name }}'.TrimStart('v')
          $archive = "aitriage_${cleanVersion}_Windows_x86_64.zip"
          Compress-Archive -LiteralPath "dist\$env:BINARY_NAME" -DestinationPath $archive -Force
          $checkDir = Join-Path $env:RUNNER_TEMP 'aitriage-package-check'
          Remove-Item -Recurse -Force -LiteralPath $checkDir -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $checkDir
          $actual = & (Join-Path $checkDir $env:BINARY_NAME) version
          if ($actual -ne 'AITriage ${{ github.ref_name }}') {
            throw "Packaged Windows binary version mismatch: $actual"
          }

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          BUILD_GOOS: ${{ matrix.goos }}
          BUILD_GOARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          cd dist
          VERSION="${{ github.ref_name }}"
          CLEAN_VER="${VERSION#v}"
          OS_NAME=$(printf '%s' "$BUILD_GOOS" | awk '{print toupper(substr($0,1,1))substr($0,2)}')
          ARCH_NAME="$BUILD_GOARCH"
          if [ "$ARCH_NAME" = "amd64" ]; then ARCH_NAME="x86_64"; fi

          tar -czf "../aitriage_${CLEAN_VER}_${OS_NAME}_${ARCH_NAME}.tar.gz" "$BINARY_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: aitriage_*

  release:
    name: Create Release
    needs: build
    if: github.actor_id == '184216056'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          # Checksum the release binaries AND both official installers so their
          # integrity is independently verifiable from the same manifest.
          sha256sum aitriage_* install.sh install.ps1 > checksums.txt

      - name: Verify release payload
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c checksums.txt
          unzip -t aitriage_*_Windows_x86_64.zip
          test "$(unzip -Z1 aitriage_*_Windows_x86_64.zip)" = "aitriage.exe"
          for archive in aitriage_*.tar.gz; do
            gzip -t "$archive"
            test "$(tar -tzf "$archive")" = "aitriage"
          done

      # The released CLI pins setup to the image tag matching its own version.
      # Do not expose a downloadable release while that image is still being
      # built by docker-publish.yml: the documented one-command installation
      # must either work completely or the release must remain unpublished.
      - name: Wait for matching multi-arch scanner image
        timeout-minutes: 60
        env:
          RELEASE_IMAGE: ghcr.io/dodobrands/aitriage:${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if manifest=$(docker buildx imagetools inspect "$RELEASE_IMAGE" --raw 2>/dev/null); then
              platforms=$(printf '%s' "$manifest" | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"')
              if printf '%s\n' "$platforms" | grep -qx 'linux/amd64' && \
                 printf '%s\n' "$platforms" | grep -qx 'linux/arm64'; then
                # A retag can leave the previous image under this name while
                # the new build runs. Verify the embedded source revision too.
                if docker pull --quiet --platform linux/amd64 "$RELEASE_IMAGE" >/dev/null; then
                  revision=$(docker image inspect "$RELEASE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
                  if [ "$revision" = "$RELEASE_SHA" ]; then
                    echo "Verified $RELEASE_IMAGE for linux/amd64 and linux/arm64 at $RELEASE_SHA."
                    exit 0
                  fi
                  echo "Image revision $revision does not match release commit $RELEASE_SHA yet."
                fi
              fi
            fi
            echo "Waiting for $RELEASE_IMAGE ($attempt/120)..."
            sleep 30
          done
          echo "Timed out waiting for the matching multi-arch scanner image." >&2
          exit 1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aitriage_*
            dist/checksums.txt
            scripts/install.sh
            scripts/install.ps1
          generate_release_notes: true
