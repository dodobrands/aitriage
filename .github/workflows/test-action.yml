name: Test Action

# Validates the Docker Action wiring against the CURRENT code in the PR by
# building the image locally (action.yml itself uses the pre-built GHCR image,
# so we build here to exercise unmerged changes to Dockerfile/entrypoint.sh).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    # No checkout or Docker build for an actor other than the repository owner.
    if: github.actor_id == '184216056'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build action image
        run: docker build --build-arg AITRIAGE_VERSION=test-${{ github.sha }} -t aitriage:test .

      - name: Verify scanner bundle inside the image
        run: |
          docker run --rm --entrypoint sh aitriage:test -c '
            set -eu
            test -z "$(find / -xdev -path "*/pip/_vendor*" -print -quit)"
            test -z "$(find / -xdev -name "pip-*.dist-info" -print -quit)"
            ! command -v pip3 >/dev/null
            ! command -v pipx >/dev/null
            aitriage version
            semgrep --version
            /opt/pipx/venvs/semgrep/bin/python -c "import importlib.metadata as m; assert m.version(\"mcp\") == \"1.28.1\"; assert m.version(\"setuptools\") == \"83.0.0\"; assert m.version(\"PyJWT\") == \"2.14.0\""
            /opt/pipx/venvs/bandit/bin/python -c "import importlib.metadata as m; assert m.version(\"setuptools\") == \"83.0.0\""
            trivy --version
            gitleaks version
            bandit --version
            mkdir -p /tmp/scanner-smoke
            printf "%s\n" "rules:" "  - id: self-comparison" "    languages: [python]" "    severity: WARNING" "    message: self comparison" "    pattern: \"\$X == \$X\"" > /tmp/scanner-smoke/rule.yml
            printf "%s\n" "value = 1" "print(value)" > /tmp/scanner-smoke/clean.py
            semgrep scan --config=/tmp/scanner-smoke/rule.yml --json --quiet /tmp/scanner-smoke/clean.py >/dev/null
            bandit -r /tmp/scanner-smoke/clean.py -f json -q >/dev/null
          '

      - name: Run scan via entrypoint (SARIF gate)
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" \
            -e AITRIAGE_COMMAND=scan \
            -e AITRIAGE_PROJECT_DIR=/project \
            -e AITRIAGE_FORMAT=sarif \
            -e AITRIAGE_OUTPUT_FILE=/project/aitriage-results.sarif \
            -e AITRIAGE_FAIL_ON=never \
            --entrypoint /entrypoint.sh \
            aitriage:test

      - name: Verify SARIF output exists
        run: test -s aitriage-results.sarif && echo "SARIF generated OK"
