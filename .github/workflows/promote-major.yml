name: Promote major tag

# Points the Action's major version at a stable release, as GitHub recommends
# for actions: dodobrands/aitriage@v1 runs the newest v1 release. The v1 git
# tag and the ghcr.io/dodobrands/aitriage:v1 image move together, because the
# action.yml of a release runs the :v1 image. The release workflow calls this
# once the release is published, which happens only after its image passed the
# publish gate; it can also be run by hand for an existing release. A major tag
# never moves back to an older release, and a failed run puts both tags back.
#
# GitHub does not let the workflow token move a tag across commits that change
# files in .github/workflows. Such a move needs the MAJOR_TAG_TOKEN secret: a
# fine-grained token for this repository with Contents and Workflows set to
# read and write. Without it, move the git tag yourself
# (git push -f origin <release commit>:refs/tags/v1) and run this workflow for
# the release: it then finds the git tag in place and moves the image.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to promote, for example v1.14.0
        required: true
        type: string
    secrets:
      MAJOR_TAG_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote, for example v1.14.0
        required: true
        type: string

concurrency:
  group: promote-major
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    # What every user of the major tag runs is changed only by the repository
    # owner's immutable GitHub account ID, like the release itself.
    if: github.actor_id == '184216056'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      IMAGE: ghcr.io/dodobrands/aitriage
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a stable release tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          state=$(gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
          if [ "$state" != "false false" ]; then
            echo "::error::$TAG is not a published stable release"
            exit 1
          fi
          newest=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 200 --json tagName -q '.[].tagName' \
            | grep -E "^${major}\.[0-9]+\.[0-9]+$" | sort -V | tail -n1)
          if [ "$newest" != "$TAG" ]; then
            echo "::error::$TAG is not the newest $major release ($newest is); a major tag never moves back"
            exit 1
          fi
          {
            echo "MAJOR=$major"
            echo "SHA=$(gh api "repos/$REPO/commits/$TAG" -q .sha)"
            echo "PREV_SHA=$(gh api "repos/$REPO/commits/$major" -q .sha 2>/dev/null || true)"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check the release image
        run: |
          set -euo pipefail
          # The image must be the one built from the release commit.
          docker pull --quiet --platform linux/amd64 "$IMAGE:$TAG" >/dev/null
          revision=$(docker image inspect "$IMAGE:$TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [ "$revision" != "$SHA" ]; then
            echo "::error::$IMAGE:$TAG was built from $revision, not from the release commit $SHA"
            exit 1
          fi
          prev=$( (docker buildx imagetools inspect "$IMAGE:$MAJOR" 2>/dev/null || true) | awk '/^Digest:/{print $2; exit}')
          echo "PREV_DIGEST=$prev" >> "$GITHUB_ENV"

      # The git tag moves first: if the repository refuses the update, nothing
      # has changed yet.
      - name: Move the git tag
        id: tag
        env:
          TAG_TOKEN: ${{ secrets.MAJOR_TAG_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "$PREV_SHA" = "$SHA" ]; then
            echo "$MAJOR already points at $TAG"
            exit 0
          fi
          if [ -n "$PREV_SHA" ]; then
            update=(api -X PATCH "repos/$REPO/git/refs/tags/$MAJOR" -f sha="$SHA" -F force=true)
          else
            update=(api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$SHA")
          fi
          if ! GH_TOKEN="$TAG_TOKEN" gh "${update[@]}" >/dev/null; then
            echo "::error::GitHub refused to move the $MAJOR git tag to $TAG. The workflow token cannot move a tag across changes to .github/workflows: add the MAJOR_TAG_TOKEN secret (fine-grained token for this repository, Contents and Workflows: read and write), or run 'git push -f origin $SHA:refs/tags/$MAJOR' and run this workflow again. Nothing was changed."
            exit 1
          fi

      - name: Move the image tag
        id: image
        run: docker buildx imagetools create --tag "$IMAGE:$MAJOR" "$IMAGE:$TAG"

      - name: Verify
        run: |
          set -euo pipefail
          platforms() {
            docker buildx imagetools inspect --raw "$1" \
              | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture) \(.digest)"' \
              | sort
          }
          test -n "$(platforms "$IMAGE:$TAG")"
          test "$(platforms "$IMAGE:$MAJOR")" = "$(platforms "$IMAGE:$TAG")"
          test "$(gh api "repos/$REPO/commits/$MAJOR" -q .sha)" = "$SHA"
          echo "\`$MAJOR\` (git tag and \`$IMAGE:$MAJOR\`) now points at $TAG ($SHA)." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore the previous major tags
        if: failure() && steps.tag.outcome == 'success'
        env:
          IMAGE_MOVED: ${{ steps.image.outcome == 'success' }}
          GH_TOKEN: ${{ secrets.MAJOR_TAG_TOKEN || github.token }}
        run: |
          set -uo pipefail
          if [ "$PREV_SHA" = "$SHA" ]; then
            :
          elif [ -n "$PREV_SHA" ]; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$MAJOR" -f sha="$PREV_SHA" -F force=true >/dev/null
          else
            gh api -X DELETE "repos/$REPO/git/refs/tags/$MAJOR"
          fi
          if [ "$IMAGE_MOVED" = "true" ] && [ -n "$PREV_DIGEST" ]; then
            docker buildx imagetools create --tag "$IMAGE:$MAJOR" "$IMAGE@$PREV_DIGEST"
          fi
