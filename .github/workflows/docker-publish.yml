name: Publish Docker Image (GHCR)

# Builds the all-in-one AITriage image ONCE here and publishes it to the
# GitHub Container Registry. The consumer-facing Docker Action (action.yml)
# then pulls this pre-built image instead of rebuilding the Dockerfile on
# every run, cutting Action runtime from ~15 min to a few seconds.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dodobrands/aitriage

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    # Publishing an image is reserved for the repository owner's immutable
    # GitHub account ID. This repository deliberately has one operator.
    if: github.actor_id == '184216056'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU (for linux/arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # The Action's :v1 channel is advanced only by an explicit owner decision.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=tag

      - name: Resolve embedded AITriage version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go for process E2E
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Free up runner disk space
        # The all-in-one scanner image is large; on the standard runner the
        # build + local load + gha cache export exhaust the ~14 GB of free
        # space and the runner process dies. Reclaim ~25 GB from preinstalled
        # toolchains we do not use (Go is kept for the process E2E step).
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af || true
          echo "Free space after cleanup:"; df -h /

      - name: Build publish candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: aitriage:publish-candidate
          build-args: |
            AITRIAGE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify scanner bundle
        run: |
          docker run --rm --entrypoint sh aitriage:publish-candidate -c '
            set -eu
            test -z "$(find / -xdev -path "*/pip/_vendor*" -print -quit)"
            test -z "$(find / -xdev -name "pip-*.dist-info" -print -quit)"
            ! command -v pip3 >/dev/null
            ! command -v pipx >/dev/null
            aitriage version
            semgrep --version
            /opt/pipx/venvs/semgrep/bin/python -c "import importlib.metadata as m; assert m.version(\"mcp\") == \"1.28.1\"; assert m.version(\"setuptools\") == \"83.0.0\""
            /opt/pipx/venvs/bandit/bin/python -c "import importlib.metadata as m; assert m.version(\"setuptools\") == \"83.0.0\""
            trivy --version
            gitleaks version
            bandit --version
            mkdir -p /tmp/scanner-smoke
            printf "%s\n" "rules:" "  - id: self-comparison" "    languages: [python]" "    severity: WARNING" "    message: self comparison" "    pattern: \"\$X == \$X\"" > /tmp/scanner-smoke/rule.yml
            printf "%s\n" "value = 1" "print(value)" > /tmp/scanner-smoke/clean.py
            semgrep scan --config=/tmp/scanner-smoke/rule.yml --json --quiet /tmp/scanner-smoke/clean.py >/dev/null
            bandit -r /tmp/scanner-smoke/clean.py -f json -q >/dev/null
          '

      - name: Run full scanner process E2E
        env:
          AITRIAGE_IMAGE: aitriage:publish-candidate
        run: go test ./cmd/aitriage -run '^TestE2E_ContainerRunFullScannerBundle$' -count=1 -v

      - name: Scan publish candidate for fixable vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
            --quiet --severity HIGH,CRITICAL --ignore-unfixed \
            --scanners vuln --list-all-pkgs --format json \
            aitriage:publish-candidate > trivy-image.json

          jq '{findings: [.Results[] as $result | $result.Vulnerabilities[]? | {
            target: $result.Target,
            package: .PkgName,
            path: .PkgPath,
            installed: .InstalledVersion,
            fixed: .FixedVersion,
            severity: .Severity,
            id: .VulnerabilityID
          }]}' trivy-image.json

          test "$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image.json)" -eq 0

      - name: Upload candidate vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-publish-candidate-${{ github.sha }}
          path: trivy-image.json

      - name: Remove amd64 candidate from the runner
        run: docker image rm aitriage:publish-candidate

      - name: Build arm64 smoke candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          tags: aitriage:arm64-smoke
          build-args: |
            AITRIAGE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha

      - name: Verify arm64 scanner bundle
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh aitriage:arm64-smoke -c '
            set -eu
            test -z "$(find / -xdev -path "*/pip/_vendor*" -print -quit)"
            ! command -v pip3 >/dev/null
            ! command -v pipx >/dev/null
            aitriage version
            semgrep --version
            semgrep scan --help >/dev/null
            bandit --version
            trivy --version
            gitleaks version
          '

      - name: Remove arm64 candidate from the runner
        run: docker image rm aitriage:arm64-smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Multi-arch: amd64 (CI/native) + arm64 (Apple Silicon). Source-built
          # scanner binaries are cross-compiled for each target architecture.
          # A single manifest lets `docker pull` resolve the correct image.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AITRIAGE_VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
