name: 'AITriage Security Scan'
description: 'Deterministic security scanner for AI-generated codebases. SARIF gate + optional AI triage.'
author: 'dodobrands'

inputs:
  command:
    description: 'aitriage subcommand to run: scan (default), agent, fix, sbom. Exit 1 means the security gate failed. agent exits 2 when the audit could not complete (LLM provider failure, missing scanner): re-run it, it is not a verdict on the code.'
    required: false
    default: 'scan'
  project-dir:
    description: 'Directory to scan. Default is the repository root.'
    required: false
    default: '.'
  format:
    description: 'Output format for scan: terminal, json, sarif, html.'
    required: false
    default: 'sarif'
  output-file:
    description: 'Write formatted scan output to this file (e.g. results.sarif).'
    required: false
    default: ''
  fail-on:
    description: 'When command scan exits 1 (blocks the job): critical (active CRITICAL/HIGH), any, confirmed, never. confirmed blocks only AI-confirmed findings and is meant for command agent, whose gate comes from args (e.g. --fail-on confirmed) or .aitriage.yaml.'
    required: false
    default: 'critical'
  fail-score:
    description: 'Fail if the Health Check score is below this threshold (0 disables score gating). Command scan; for agent pass --fail-score in args.'
    required: false
    default: '0'
  health-profile:
    description: 'Health Check policy profile for the Security Gate: baseline, standard, strict. Command scan; for agent pass --health-profile in args.'
    required: false
    default: ''
  stack:
    description: 'Force a specific stack (e.g. nextjs, fastapi) instead of auto-detection. Command scan only.'
    required: false
    default: ''
  diff:
    description: 'Scan only files changed vs a git ref (e.g. origin/main, HEAD~1). Command scan only.'
    required: false
    default: ''
  baseline:
    description: 'Report only NEW findings not present in the baseline (true/false). Command scan only.'
    required: false
    default: 'false'
  args:
    description: 'Freeform extra args appended to the command: the agent gate (--fail-on critical|any|confirmed|never, --fail-score, --health-profile, --confirmed-min-severity, --iac-findings report|block), report paths, or advanced scan flags.'
    required: false
    default: ''
  summary-file:
    description: 'Write the actionable summary (TP/NR only, no FP) to this file. Agent command only.'
    required: false
    default: ''
  verdict-cache-dir:
    description: 'Directory for the deterministic AI verdict cache. Leave empty to disable.'
    required: false
    default: ''
  artifact-cache-dir:
    description: 'Directory for exact secondary artifact cache bundles (PoC/report/fixspec). Leave empty to disable.'
    required: false
    default: ''

runs:
  using: 'docker'
  # The Action's image channel. promote-major.yml moves :v1 together with the
  # v1 git tag after each stable release, so @v1 always runs the image built
  # for the action.yml it ships.
  image: 'docker://ghcr.io/dodobrands/aitriage:v1'
  entrypoint: '/entrypoint.sh'
  env:
    AITRIAGE_COMMAND: ${{ inputs.command }}
    AITRIAGE_PROJECT_DIR: ${{ inputs.project-dir }}
    AITRIAGE_FORMAT: ${{ inputs.format }}
    AITRIAGE_OUTPUT_FILE: ${{ inputs.output-file }}
    AITRIAGE_FAIL_ON: ${{ inputs.fail-on }}
    AITRIAGE_FAIL_SCORE: ${{ inputs.fail-score }}
    AITRIAGE_HEALTH_PROFILE: ${{ inputs.health-profile }}
    AITRIAGE_STACK: ${{ inputs.stack }}
    AITRIAGE_DIFF: ${{ inputs.diff }}
    AITRIAGE_BASELINE: ${{ inputs.baseline }}
    AITRIAGE_ARGS: ${{ inputs.args }}
    AITRIAGE_SUMMARY_FILE: ${{ inputs.summary-file }}
    AITRIAGE_VERDICT_CACHE_DIR: ${{ inputs.verdict-cache-dir }}
    AITRIAGE_ARTIFACT_CACHE_DIR: ${{ inputs.artifact-cache-dir }}

branding:
  icon: 'shield'
  color: 'blue'
