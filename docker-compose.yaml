# ─── AITriage Docker Compose ───────────────────────────────────────────────────
# Web dashboard and API (default):
#   make up   (or: docker compose up -d web)
#
# One-off interactive scan of a project under SCAN_ROOT (mounted at /host):
#   docker compose run --rm web scan /host/<project> -i
#
# MCP server over SSE for AI clients (http://localhost:9090/sse):
#   docker compose --profile agent up -d aitriage-mcp
#
# Set SCAN_ROOT, PROJECT_PATH and API keys in .env (see .env.example).
# ──────────────────────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: aitriage:latest
    container_name: aitriage-web
    restart: unless-stopped
    volumes:
      # Mount scan workspace (configure SCAN_ROOT in .env)
      # Example: SCAN_ROOT=~/Documents/GitHub
      - ${SCAN_ROOT:-.}:/host
      # Persistent SQLite volume
      - aitriage-data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-super-secret-development-key-change-in-prod}
      - DB_PATH=/app/data/aitriage.db
      # Inside the image the server runs in-process and must listen on all
      # container interfaces for the published port to reach it.
      - AITRIAGE_RUNTIME=container
      - TERM=xterm-256color
    ports:
      # The dashboard has no authentication: publish it on localhost only.
      - "127.0.0.1:8080:8080"
    command: ["web", "--runtime", "native", "--port", "8080", "--host-prefix", "/host"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    tty: true
    stdin_open: true

  # ─── AITriage MCP Server (SSE) ──────────────────────────────────────────────
  # Serves the AITriage MCP tools over HTTP for AI clients that connect by URL.
  # The audited project is PROJECT_PATH, mounted read-only at /project.
  # Endpoint: http://localhost:9090/sse
  aitriage-mcp:
    image: aitriage:latest
    container_name: aitriage-mcp
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--transport", "sse", "--port", "9090"]
    ports:
      # No authentication on the SSE endpoint: publish it on localhost only.
      - "127.0.0.1:9090:9090"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ${PROJECT_PATH:-.}:/project:ro
    profiles:
      - agent

volumes:
  aitriage-data:
    name: aitriage_sqlite_data
