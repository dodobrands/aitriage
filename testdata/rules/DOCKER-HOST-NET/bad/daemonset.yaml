apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      # ruleid: DOCKER-HOST-NET
      hostNetwork: true
      containers:
        - name: exporter
          image: example/node-exporter:1.8
