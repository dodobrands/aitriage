<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AITriage Obsidian</title>
    <script>
      (function() {
        try {
          var accent = localStorage.getItem('aitriage_accent') || 'white';
          var background = localStorage.getItem('aitriage_background') || 'obsidian';
          var backgroundMotion = localStorage.getItem('aitriage_background_motion') || 'on';
          document.documentElement.setAttribute('data-accent', accent);
          document.documentElement.setAttribute('data-bg', background);
          document.documentElement.setAttribute('data-bg-motion', backgroundMotion);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
