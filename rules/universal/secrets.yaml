# ============================================================
# AITRIAGE RULES: Universal — Hardcoded Secret Detection
# ============================================================
# Documentation only. These checks are implemented in Go
# (internal/engine/secrets.go, called from evaluateEntropy in
# internal/engine/engine.go), not by a regex rule in this file.
# Entries with `target: entropy-analysis` are skipped when the
# engine loads the catalog.
#
# What the detector reports, by rule id:
#
#   SECRET-<VENDOR>   A credential with a recognisable vendor
#                     format, found in code, .env and config
#                     files (YAML, JSON, TOML, Terraform, INI,
#                     properties, XML). The ids are listed in
#                     `secretSignatures` in secrets.go, which is
#                     the source of truth for ids and severities:
#                     SECRET-PRIVATE-KEY, SECRET-AWS-AKID,
#                     SECRET-GH-PAT, SECRET-GH-TOKEN,
#                     SECRET-SLACK-TOKEN, SECRET-SLACK-WEBHOOK,
#                     SECRET-ANTHROPIC, SECRET-OPENAI,
#                     SECRET-STRIPE, SECRET-SENDGRID,
#                     SECRET-GOOGLE-API, SECRET-NPM,
#                     SECRET-TWILIO, SECRET-JWT,
#                     SECRET-CONN-STRING.
#   SECRET-ASSIGN     A high-entropy string literal assigned to a
#                     secret-named variable (api_key = "...").
#   SECRET-LEAK-LOG   Any of the above whose variable is also
#                     passed to a log or print call in the file.
#
# Test files and vendored directories (node_modules, vendor,
# dist, .git, .next) are skipped. The old ids ENTROPY-SECRET and
# ENTROPY-SECRET-LEAK were never emitted; an inline
# `aitriage-ignore ENTROPY-SECRET` is still honoured as an alias.
# ============================================================

rules:
  - id: SECRET-ASSIGN
    name: "Hardcoded Secret Assigned to a Variable"
    stack: universal
    # Scans: .go, .py, .ts, .tsx, .js, .jsx and .env files.
    # The vendor-format signatures (SECRET-<VENDOR>) also scan config files.
    target: "entropy-analysis"
    severity: CRITICAL
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2025"
    suggestion: "A secret is hardcoded in the source. Remove it, load the value from a secret manager or environment variable, and rotate the exposed credential."

  - id: SECRET-LEAK-LOG
    name: "Hardcoded Secret Leaked to Logger"
    stack: universal
    # Replaces the finding of the underlying secret when the variable that
    # holds it is passed to a print/log/console call in the same file.
    target: "entropy-analysis"
    severity: CRITICAL
    metadata:
      cwe: "CWE-532"
      owasp: "A09:2025"
    suggestion: "A hardcoded secret is also written to a log. Remove the secret and the log statement, and rotate the credential."
