# ============================================================
# AITRIAGE RULES: Universal — Entropy & Security Hygiene
# ============================================================
# These rules apply to ALL technology stacks.
# They detect misconfigurations, weak crypto, insecure defaults,
# and common security anti-patterns.
# ============================================================

rules:
  - id: ENTR-02
    name: "Missing Lockfile"
    stack: universal
    extensions: [".json", ".txt", ".toml", ".yaml", ".lock", ".sum"]
    target: filename
    condition: "missing_lockfile"
    # A lockfile is only required for a package manager the project actually
    # uses. Each entry is checked independently: a PHP project is asked for
    # composer.lock and nothing else.
    # npm-family workspaces share a lockfile at their declared workspace root.
    # Ancestor lockfiles only count for explicitly included workspace members.
    ecosystems:
      - name: "npm"
        manifests: ["package.json"]
        lockfiles: ["package-lock.json", "yarn.lock", "pnpm-lock.yaml", "npm-shrinkwrap.json", "bun.lockb", "bun.lock"]
        workspace_root: true
      - name: "Composer (PHP)"
        manifests: ["composer.json"]
        lockfiles: ["composer.lock"]
      - name: "Go"
        manifests: ["go.mod"]
        lockfiles: ["go.sum"]
      - name: "Python"
        manifests: ["pyproject.toml", "Pipfile", "requirements.in"]
        lockfiles: ["poetry.lock", "Pipfile.lock", "uv.lock", "pdm.lock", "requirements.txt", "requirements.lock"]
      - name: "Cargo (Rust)"
        manifests: ["Cargo.toml"]
        lockfiles: ["Cargo.lock"]
      - name: "Bundler (Ruby)"
        manifests: ["Gemfile"]
        lockfiles: ["Gemfile.lock"]
      - name: "Mix (Elixir)"
        manifests: ["mix.exs"]
        lockfiles: ["mix.lock"]
      - name: "NuGet (.NET)"
        manifests: ["packages.config", "Directory.Packages.props"]
        lockfiles: ["packages.lock.json"]
      - name: "Gradle"
        manifests: ["build.gradle", "build.gradle.kts"]
        lockfiles: ["gradle.lockfile", "gradle/verification-metadata.xml"]
      - name: "CocoaPods"
        manifests: ["Podfile"]
        lockfiles: ["Podfile.lock"]
      - name: "Deno"
        manifests: ["deno.json", "deno.jsonc"]
        lockfiles: ["deno.lock"]
    severity: HIGH
    suggestion: "A dependency manifest has no lockfile. Deployment will be nondeterministic and vulnerable to dependency hijacking. Commit the lockfile for the package manager named in the evidence."

  - id: ENTR-11
    name: "Placeholder Leaked to Production"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".tsx", ".jsx", ".env"]
    target: all
    pattern: "(?i)(YOUR_API_KEY_HERE|REPLACE_ME|INSERT_TOKEN|change_me)"
    severity: HIGH
    suggestion: "Placeholder left in code. Replace with actual configuration or logic."

  - id: ENTR-12
    name: "God File Detected"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".tsx", ".jsx"]
    target: condition
    condition: "large_file"
    exclude_tests: true
    exclude_paths: ["seed", "migration", "scripts/", "fixtures/", "testdata/"]
    severity: LOW
    suggestion: "File exceeds 1500 lines. Refactor into smaller modules."

  - id: ENTR-13
    name: "Debug Logs Spam"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".tsx", ".jsx"]
    target: all
    pattern: '(?m)^(?:console\.log|print|fmt\.Println)\s*\(.*(here|test|debug|wtf|aaaa).*$'
    severity: LOW
    suggestion: "Spammy debug logs found. Remove them before merging."

  - id: ENTR-17
    name: "Hardcoded Password"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".env"]
    target: all
    pattern: '(?i)password\s*[=:]\s*["\x27][^"\x27${}]{8,}["\x27]'
    severity: HIGH
    suggestion: "Hardcoded password found. Move to environment variables."

  - id: ENTR-18
    name: "Insecure Defaults"
    stack: universal
    extensions: [".py", ".ts", ".js", ".go"]
    target: all
    exclude_tests: true
    pattern: "(?i)(0\\.0\\.0\\.0|DEBUG\\s*=\\s*True|debug:\\s*true)"
    severity: HIGH
    suggestion: "Application configured to listen on all interfaces or debug mode enabled."

  - id: ENTR-19
    name: "Default Credentials"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".yaml", ".yml", ".env"]
    target: all
    pattern: "(?i)(admin:admin|root:root|postgres:postgres)"
    severity: HIGH
    suggestion: "Default credentials detected. Change immediately."

  - id: ENTR-20
    name: "AI Rules File Backdoor (.cursorrules Manipulation)"
    stack: universal
    extensions: [".cursorrules", ".md", ".txt", "prompt"]
    target: code
    pattern: "(?i)(ignore security|skip security checks|do not sanitize|bypass auth|disable validation|never use parameterized)"
    severity: CRITICAL
    suggestion: "Malicious instructions found in AI configuration files. Attackers may be manipulating your AI assistant to generate backdoored code."

  - id: ENTR-21
    name: "Weak Cryptographic Hash (MD5)"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: code
    pattern: "(?i)(import md5|const md5|crypto\\.createHash\\(['\"]md5['\"]\\)|hashlib\\.md5\\()"
    severity: HIGH
    suggestion: "MD5 is cryptographically broken. Use SHA-256 or bcrypt."

  - id: ENTR-WEAK-CRYPTO
    name: "Weak Cryptographic Hash (MD5/SHA1)"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: all
    pattern: "(?i)(md5|sha1|crypto\\.createHash\\s*\\(\\s*[\"'](md5|sha1)[\"']\\))"
    severity: HIGH
    suggestion: "MD5/SHA1 detected. Use SHA-256 or better for security-sensitive hashing."

  - id: ENTR-OPEN-REDIRECT
    name: "Open Redirect Vulnerability"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: all
    pattern: '(?i)(res\.redirect|redirect)\s*\(.*?(req\.query|request\.args|Params).*?\)'
    severity: HIGH
    suggestion: "User-controlled URL in redirect. Validate against an allowlist."

  - id: ENTR-INSECURE-COOKIE
    name: "Insecure Cookie Configuration"
    stack: universal
    extensions: [".ts", ".js", ".py"]
    target: all
    pattern: '(?i)(res\.cookie|set_cookie)\s*\(.*?\)'
    condition: "not_contains:HttpOnly"
    severity: MEDIUM
    suggestion: "Cookie missing HttpOnly flag. Vulnerable to XSS token theft."

  - id: ENTR-HALLUCINATION
    name: "Potential Package Hallucinations"
    stack: universal
    extensions: [".go", ".js", ".ts", ".py"]
    target: all
    pattern: "(?i)(import\\s+[\"'](fake-lib|utility-engine|agent-utils-core|magic-helper)[\"']|require\\([\"'](fake-lib|magic-helper)[\"']\\))"
    severity: HIGH
    suggestion: "Reference to common AI-hallucinated packages. Verify these dependencies actually exist."

  - id: ENTR-FRAGILE-LOGIC
    name: "Brittle Logic (Missing Safety)"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: all
    pattern: '(?m)^(\s*)if\s+err\s*!=\s*nil\s*\{\s*return\s*nil\s*\}'
    severity: HIGH
    suggestion: "Silent error return found. Implement proper logging and recovery."

  - id: ENTR-SSRF
    name: "SSRF Risk (URL from User Input)"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: all
    pattern: '(?i)(fetch|axios|requests?\.(get|post)|http\.(Get|Post)|urllib|httpx)\s*\(\s*(req\.|request\.|params|query|args)'
    severity: HIGH
    suggestion: "User-controlled URL passed to HTTP client. Validate against an allowlist to prevent SSRF."

  - id: ENTR-NOSQL-INJECTION
    name: "NoSQL Injection Operators"
    stack: universal
    extensions: [".ts", ".js"]
    target: all
    pattern: '(?i)\.(find|findOne|aggregate)\s*\(\s*\{[^}]*\$(?:ne|gt|lt|regex|where|or|and)\b'
    severity: CRITICAL
    suggestion: "MongoDB query with operator injection risk. Sanitize input and reject $ operators from user data."

  - id: ENTR-PRIVATE-KEY
    name: "Private Key in Source Code"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".env", ".yaml", ".yml", ".json"]
    target: all
    pattern: '-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'
    severity: CRITICAL
    suggestion: "Private key embedded in source code. Remove immediately and rotate the key."

  - id: ENTR-JWT-NONE
    name: "JWT None Algorithm Attack"
    stack: universal
    extensions: [".ts", ".js", ".py"]
    target: all
    pattern: '(?i)algorithm[s]?\s*[:=]\s*[\[\(]?\s*["\x27]none["\x27]'
    severity: CRITICAL
    suggestion: "JWT configured with 'none' algorithm. This disables signature verification entirely."

  - id: ENTR-CORS-WILDCARD
    name: "CORS Wildcard Origin"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".cs"]
    target: all
    pattern: '(?i)(?:Access-Control-Allow-Origin|allowedOrigins?|origin)\s*[:=]\s*["\x27]\*["\x27]'
    severity: HIGH
    suggestion: "CORS allows all origins. Restrict to specific trusted domains."

  - id: ENTR-INNERHTML
    name: "Direct innerHTML Assignment"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx"]
    target: all
    pattern: '\.innerHTML\s*='
    severity: HIGH
    suggestion: "Direct innerHTML assignment bypasses XSS protection. Use textContent or a sanitizer (DOMPurify)."

  - id: ENTR-EVAL-FUNC
    name: "Dynamic Code via new Function()"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx"]
    target: all
    exclude_tests: true
    pattern: 'new\s+Function\s*\('
    severity: CRITICAL
    suggestion: "new Function() executes arbitrary code. Remove or sandbox."

  - id: ENTR-INSECURE-RANDOM
    name: "Insecure Randomness (Math.random)"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx"]
    target: all
    pattern: 'Math\.random\s*\(\s*\)'
    severity: HIGH
    suggestion: "Math.random() is not cryptographically secure. Use crypto.randomUUID() or crypto.getRandomValues() for tokens, keys, and IDs."

  - id: ENTR-SENSITIVE-LOG
    name: "Sensitive Data in Console/Print"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".tsx", ".jsx"]
    target: all
    pattern: '(?i)(?:console\.log|fmt\.Print|print)\s*\(.*(?:password|token|secret|api_?key|private_?key|bearer)'
    severity: HIGH
    suggestion: "Sensitive data appears in console/print output. Mask before logging."

# Three rules that used to follow here reused the ids ENTR-PROTO-POLLUTION,
# ENTR-ZOMBIE-CODE and ENTR-SCAFFOLDING. The engine keeps only the first
# definition of an id, so they were shadowed and never ran in any release.
# They were removed rather than renamed: enabling never-tested heuristics
# (one of them CRITICAL and matching defensive `__proto__` checks) would add
# noise to every scan. Rule ids must be unique (see rules/catalog_test.go).
