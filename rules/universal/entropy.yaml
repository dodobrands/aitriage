# ============================================================
# AITRIAGE RULES: Universal — Security Hygiene
# ============================================================
# These rules apply to every technology stack. They detect
# misconfigurations, weak crypto, insecure defaults and common
# security anti-patterns at the language level. Framework
# configuration (Flask/Django/FastAPI debug mode, framework CORS
# helpers) is owned by the stack rules, so one defect produces
# one finding.
#
# Every regex rule declares `regions`: where a match may start
# (code, code_and_strings, comments or all). Fixtures for each
# rule live in testdata/rules/<ID>/.
# ============================================================
# Retired: ENTR-21 — duplicate of ENTR-WEAK-CRYPTO and PY-HASHLIB-WEAK; every hit was a second finding for the same call.
# Retired: ENTR-HALLUCINATION — matched four fixed fake package names; checking that a dependency exists belongs in the dependency scanner.
# Retired: ENTR-FRAGILE-LOGIC — matched idiomatic Go (`if err != nil { return nil }` in walk callbacks); golangci-lint nilerr covers the real defect.

rules:
  - id: ENTR-02
    name: "Missing Lockfile"
    stack: universal
    extensions: [".json", ".txt", ".toml", ".yaml", ".lock", ".sum"]
    target: filename
    condition: "missing_lockfile"
    # A lockfile is only required for a package manager the project actually
    # uses. Each entry is checked independently: a PHP project is asked for
    # composer.lock and nothing else.
    # npm-family workspaces share a lockfile at their declared workspace root.
    # Ancestor lockfiles only count for explicitly included workspace members.
    # Gradle and NuGet are not listed: their lockfiles are opt-in
    # (dependencyLocking, RestorePackagesWithLockFile), so a missing one is
    # the default, not a defect.
    ecosystems:
      - name: "npm"
        manifests: ["package.json"]
        lockfiles: ["package-lock.json", "yarn.lock", "pnpm-lock.yaml", "npm-shrinkwrap.json", "bun.lockb", "bun.lock"]
        workspace_root: true
      - name: "Composer (PHP)"
        manifests: ["composer.json"]
        lockfiles: ["composer.lock"]
      - name: "Go"
        manifests: ["go.mod"]
        lockfiles: ["go.sum"]
      - name: "Python"
        manifests: ["pyproject.toml", "Pipfile", "requirements.in"]
        lockfiles: ["poetry.lock", "Pipfile.lock", "uv.lock", "pdm.lock", "requirements.txt", "requirements.lock"]
      - name: "Cargo (Rust)"
        manifests: ["Cargo.toml"]
        lockfiles: ["Cargo.lock"]
      - name: "Bundler (Ruby)"
        manifests: ["Gemfile"]
        lockfiles: ["Gemfile.lock"]
      - name: "Mix (Elixir)"
        manifests: ["mix.exs"]
        lockfiles: ["mix.lock"]
      - name: "CocoaPods"
        manifests: ["Podfile"]
        lockfiles: ["Podfile.lock"]
      - name: "Deno"
        manifests: ["deno.json", "deno.jsonc"]
        lockfiles: ["deno.lock"]
    severity: MEDIUM
    metadata:
      cwe: "CWE-829"
      owasp: "A03:2025"
      confidence: medium
      subcategory: policy
    suggestion: "A dependency manifest has no lockfile, so every install can resolve different versions, including a compromised release. Commit the lockfile for the package manager named in the evidence."

  - id: ENTR-11
    name: "Placeholder Value Left in Configuration"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx", ".py", ".go", ".env"]
    target: all
    regions: code_and_strings
    pattern: '(?i)(?:\b|_)(?:your_api_key_here|replace_me|insert_token|change_?me)(?:\b|_)'
    severity: MEDIUM
    metadata:
      cwe: "CWE-1188"
      owasp: "A02:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "A placeholder value is used as configuration. If it is a fallback for a secret, fail at startup when the real value is missing instead of running with a known default."

  - id: ENTR-12
    name: "God File Detected"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".tsx", ".jsx"]
    target: condition
    condition: "large_file"
    exclude_tests: true
    exclude_paths: ["seed", "migration", "scripts/", "fixtures/", "testdata/", ".pb.go", "_pb2.py", "_pb2_grpc.py", "_pb.js", "_pb.ts", ".pb.ts", ".gen.ts", ".gen.go", "_gen.go", ".generated.", "_generated.", "generated/", "__generated__/", "zz_generated"]
    # Generated code is skipped: the second condition rejects files whose
    # header (first 15 lines of comments and strings) carries a generator
    # marker such as "Code generated ... DO NOT EDIT" or "@generated".
    patterns:
      - target: condition
        condition: "large_file"
      - target: docs
        pattern-not: '\A(?:[^\n]*\n){0,15}?[^\n]*?(?:\bDO NOT EDIT\b|@generated\b|(?i:\bauto-?generated\b|\bautomatically generated\b|\bgenerated by (?:the )?(?:protocol buffer compiler|protoc|sqlc|gqlgen|mockgen|stringer|openapi|swagger|orval|prisma|graphql-codegen)))'
    severity: LOW
    metadata:
      cwe: "CWE-1080"
      confidence: high
      subcategory: quality
    suggestion: "File exceeds 1500 lines. Split it into smaller modules; this is a maintainability signal, not a vulnerability."

  - id: ENTR-13
    name: "Debug Logs Spam"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".tsx", ".jsx"]
    target: all
    regions: code
    pattern: '(?im)^[ \t]*(?:console\.(?:log|debug)|print|fmt\.Print(?:ln|f)?)\s*\(\s*["\x27\x60][ \t]*(?:(?:here|debug|wtf|test|got here|a{4,}|x{4,})[ \t]*(?:["\x27\x60]|[:!]|\d)|\d+[ \t]*["\x27\x60])'
    severity: LOW
    metadata:
      cwe: "CWE-489"
      owasp: "A02:2025"
      confidence: medium
      subcategory: policy
    suggestion: "Throwaway debug output (\"here\", \"debug\", \"test\") is left in the code. Remove it or replace it with structured logging at debug level."

  - id: ENTR-17
    name: "Hardcoded Password"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx", ".py", ".go", ".env"]
    target: all
    regions: code_and_strings
    pattern: '(?m)(?:^|[^\w.\n])(?i:(?:db_|admin_|root_|user_|default_|app_|smtp_|mail_|redis_|mysql_|postgres_|ldap_)?pass(?:word|wd)?)["\x27]?\s*(?::=|[=:])\s*["\x27]([^"\x27\s${}/<>*]{7,}[^"\x27\s${}/<>*.])["\x27]'
    severity: MEDIUM
    metadata:
      cwe: "CWE-259"
      owasp: "A07:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "A password is written in the source. Load it from a secret manager or an environment variable, and rotate it if this code was ever shared."

  - id: ENTR-18
    name: "Debug Mode Enabled"
    stack: universal
    extensions: [".py", ".ts", ".js", ".go"]
    target: all
    regions: code
    exclude_tests: true
    # Flask app.run(debug=True), Django DEBUG = True and FastAPI debug=True
    # are owned by the stack rules (FLASK-DEBUG, DJANGO-DEBUG, FastAPI rules).
    # Binding to 0.0.0.0 is not reported: it is the normal setting in containers.
    pattern: '\bgin\.SetMode\(\s*gin\.DebugMode\s*\)|\b(?:e|echo|srv|server|app|router)\.Debug\s*=\s*true\b|\b_\s+"net/http/pprof"|\bDebuggedApplication\s*\([^)]*\bevalex\s*=\s*True\b|\brun_simple\s*\([^)]*\buse_debugger\s*=\s*True\b|\bApplication\s*\((?:[^()]|\([^()]*\))*?\bdebug\s*=\s*True\b|\bnew\s+ApolloServer\s*\(\s*\{[^}]*\bdebug\s*:\s*true\b|\berrorHandler\s*\(\s*\{[^}]*\b(?:showStack|dumpExceptions)\s*:\s*true\b'
    severity: MEDIUM
    metadata:
      cwe: "CWE-489"
      owasp: "A02:2025"
      confidence: medium
      subcategory: audit
    suggestion: "Debug mode or a debug endpoint is enabled in server code (stack traces, interactive debugger or /debug/pprof). Enable it only from an environment setting that is off in production, or serve debug endpoints on a separate localhost-only listener."

  - id: ENTR-19
    name: "Default Credentials in Connection URL"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go", ".yaml", ".yml", ".env"]
    target: all
    regions: code_and_strings
    pattern: '(?i)\b[a-z][a-z0-9+.-]*://(?:admin:admin|root:root|postgres:postgres|admin:password|guest:guest|root:toor|sa:sa|user:password)@'
    severity: MEDIUM
    metadata:
      cwe: "CWE-1392"
      owasp: "A07:2025"
      confidence: high
      subcategory: vuln
    suggestion: "A connection URL uses a well-known default username and password. Set a unique password for the service and load the URL from configuration."

  - id: ENTR-20
    name: "AI Rules File Backdoor (Malicious Instructions)"
    stack: universal
    extensions: [".cursorrules", ".windsurfrules", ".clinerules", ".mdc", "AGENTS.md", "AGENT.md", "CLAUDE.md", "GEMINI.md", "copilot-instructions.md", "*.instructions.md", "*.prompt.md"]
    target: all
    regions: all
    # Positive instructions ("bypass auth") count only at the start of a
    # sentence, clause or list item, so "Never bypass auth" stays silent.
    pattern: '(?im)(?:(?:^|[.!?:;,(*>#-])[ \t]*|\b(?:then|always|please|just|simply|you (?:should|must|can|may))[ \t]+)(?:ignore (?:all |any )?security|skip(?:ping)? (?:the )?security (?:checks?|reviews?|scans?)|bypass (?:the )?auth(?:entication|orization)?\b|disable (?:input |all |the )?validation|(?:disable|turn off|skip) (?:tls|ssl|certificate) (?:verification|validation|checks?)|hard-?code (?:the )?(?:credentials|passwords?|api keys?|secrets?))|\b(?:do not|don[\x27’]t|never) sanitize\b|\bnever use parameterized\b'
    severity: HIGH
    metadata:
      cwe: "CWE-1427"
      owasp: "LLM01:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "An AI assistant instruction file tells the assistant to weaken security (skip validation, bypass authentication, hardcode secrets). Remove the instruction, check who added it, and review code the assistant generated while it was present."

  - id: ENTR-AI-CONFIG-HIDDEN-UNICODE
    name: "Hidden Unicode in AI Instruction File"
    stack: universal
    extensions: [".cursorrules", ".windsurfrules", ".clinerules", ".mdc", "AGENTS.md", "AGENT.md", "CLAUDE.md", "GEMINI.md", "copilot-instructions.md", "*.instructions.md", "*.prompt.md", "SKILL.md"]
    target: all
    regions: all
    # Zero-width, bidirectional-override and Unicode tag characters. The
    # zero-width joiner (U+200D) is not matched: emoji sequences use it.
    pattern: '[\x{200B}\x{200C}\x{200E}\x{200F}\x{202A}-\x{202E}\x{2060}-\x{2064}\x{2066}-\x{2069}\x{E0000}-\x{E007F}]'
    severity: HIGH
    metadata:
      cwe: "CWE-1427"
      owasp: "LLM01:2025"
      confidence: high
      subcategory: vuln
    suggestion: "An AI assistant instruction file contains invisible or text-direction characters. They can hide instructions that the assistant follows but a reviewer does not see. Remove them (show invisible characters in your editor) and review the surrounding text."

  - id: ENTR-WEAK-CRYPTO
    name: "Weak Hash Function Call (MD5/SHA-1)"
    stack: universal
    # Python is owned by PY-HASHLIB-WEAK and C# by ASP-WEAK-CRYPTO.
    extensions: [".ts", ".js", ".tsx", ".jsx", ".mjs", ".cjs", ".go"]
    target: all
    regions: code
    pattern: '\bcreateHash\s*\(\s*["\x27\x60](?i:md5|sha1)["\x27\x60]|\bCryptoJS\.(?:MD5|SHA1)\s*\(|\brequire\s*\(\s*["\x27](?:md5|sha1|js-md5|js-sha1|crypto-js/md5|crypto-js/sha1)["\x27]\s*\)|\bfrom\s+["\x27](?:md5|sha1|js-md5|js-sha1|crypto-js/md5|crypto-js/sha1)["\x27]|\bsubtle\.digest\s*\(\s*["\x27](?i:sha-1)["\x27]|\b(?:md5|sha1)\.(?:New|Sum)\s*\('
    severity: LOW
    metadata:
      cwe: "CWE-328"
      owasp: "A04:2025"
      confidence: low
      subcategory: audit
    suggestion: "MD5 or SHA-1 is called here. That is fine for cache keys and checksums, but not for passwords, signatures or tokens: use SHA-256 for integrity and bcrypt, scrypt or Argon2 for passwords."

  - id: ENTR-OPEN-REDIRECT
    name: "Open Redirect (Request Value as Redirect Target)"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: all
    regions: code
    pattern: '(?i)\bredirect\s*\(\s*(?:\d{3}\s*,\s*)?(?:req|request)\.(?:query|body|params|args|form|values|GET|POST|query_params)\b|\bRedirectResponse\s*\(\s*(?:url\s*=\s*)?request\.(?:query_params|args|form)|\bhttp\.Redirect\s*\(\s*\w+\s*,\s*\w+\s*,\s*(?:r|req)\.(?:URL\.Query\(\)|FormValue\(|Form\.Get\()|\bc\.Redirect\(\s*[^,\n]+,\s*c\.(?:Query|PostForm|Param)\('
    severity: MEDIUM
    metadata:
      cwe: "CWE-601"
      owasp: "A01:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "A redirect target comes straight from the request. Accept only relative paths or hosts from an allowlist, and fall back to a fixed page otherwise."

  - id: ENTR-INSECURE-COOKIE
    name: "Session Cookie Without HttpOnly"
    stack: universal
    extensions: [".ts", ".js", ".py"]
    target: all
    regions: code
    pattern: '(?i)\b(?:res|response|resp|reply|ctx|c)\.(?:cookie|set_cookie|setCookie|SetCookie)\s*\(\s*["\x27][^"\x27\n]*(?:sess|auth|token|jwt|sid|login|remember|refresh|access)[^"\x27\n]*["\x27]'
    condition: "not_contains:httponly"
    severity: MEDIUM
    metadata:
      cwe: "CWE-1004"
      owasp: "A02:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "A session or auth cookie is set without the HttpOnly flag, so a script injected into the page can read it. Set httpOnly (and secure, sameSite) on the cookie."

  - id: ENTR-SSRF
    name: "SSRF Risk (Request Value as Outbound URL)"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: all
    regions: code
    pattern: '(?i)\b(?:fetch|axios(?:\.(?:get|post|put|patch|delete|head|request))?|got(?:\.(?:get|post))?|requests\.(?:get|post|put|patch|delete|head|request)|httpx\.(?:get|post|put|patch|delete|head|request|stream)|urlopen|http\.(?:Get|Post|Head))\s*\(\s*(?:req|request|r|c)\.(?:query|body|params|args|form|values|GET|POST|query_params|URL\.Query\(\)|FormValue\(|Query\()'
    severity: HIGH
    metadata:
      cwe: "CWE-918"
      owasp: "A01:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "An outbound HTTP request uses a URL taken from the incoming request. Allow only known hosts and schemes, and block private, loopback and link-local addresses after DNS resolution."

  - id: ENTR-NOSQL-INJECTION
    name: "NoSQL Injection (Request Value in Query)"
    stack: universal
    extensions: [".ts", ".js"]
    target: all
    regions: code_and_strings
    pattern: '(?i)\$where["\x27]?\s*:\s*(?:"[^"\n]*"\s*\+|\x27[^\x27\n]*\x27\s*\+|\x60[^\x60]*\$\{|[A-Za-z_$][\w$.]*\s*[,}\n)])|\.(?:find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|countDocuments|aggregate)\s*\(\s*(?:req|request)\.(?:body|query|params)\b|\.(?:find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|countDocuments)\s*\(\s*\{[^}\n]*:\s*(?:req|request)\.(?:body|query|params)\.\w+\s*[,}]'
    severity: HIGH
    metadata:
      cwe: "CWE-943"
      owasp: "A05:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "A MongoDB query uses request data directly, so a client can send an operator object such as {\"$ne\": null} instead of a value. Cast values to the expected type (String(...)), validate the body with a schema, or enable sanitizeFilter; never build $where from input."

  # Retired: ENTR-PRIVATE-KEY — duplicate of the SECRET-PRIVATE-KEY detector, which also requires a key body
  - id: ENTR-JWT-NONE
    name: "JWT Signature Verification Disabled"
    stack: universal
    extensions: [".ts", ".js", ".py", ".go"]
    target: all
    regions: code_and_strings
    pattern: '(?i)\balgorithms?["\x27]?\s*[:=]\s*[\[\(]?[^\]\)\n]*["\x27]none["\x27]|\bverify_signature["\x27]?\s*:\s*False\b|\bjwt\.decode\([^)\n]*\bverify\s*=\s*False|\bUnsafeAllowNoneSignatureType\b'
    condition: "contains:jwt|jose|jws"
    severity: CRITICAL
    metadata:
      cwe: "CWE-347"
      owasp: "A07:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "JWT verification accepts the \"none\" algorithm or skips the signature check, so anyone can forge a token. Pin the expected algorithms (for example [\"RS256\"]) and always verify the signature; decode without verification only to read a header before a verified decode."

  - id: ENTR-CORS-WILDCARD
    name: "CORS Wildcard Origin"
    stack: universal
    # C# is owned by ASP-INSECURE-CORS.
    extensions: [".ts", ".js", ".tsx", ".jsx", ".mjs", ".cjs", ".py", ".go"]
    target: all
    regions: code_and_strings
    pattern: '(?i)Access-Control-Allow-Origin["\x27]?\s*[,:=]\s*["\x27]\*["\x27]|\ballow(?:ed)?_?origins?["\x27]?\s*[:=]\s*(?:\[\s*|\[\]string\{\s*)?["\x27]\*["\x27]|\borigins?["\x27]?\s*:\s*["\x27]\*["\x27]|\bAllowAllOrigins\s*[:=]\s*true\b|\bCORS_(?:ORIGIN_ALLOW_ALL|ALLOW_ALL_ORIGINS)\s*=\s*True\b'
    severity: MEDIUM
    metadata:
      cwe: "CWE-942"
      owasp: "A02:2025"
      confidence: high
      subcategory: audit
    suggestion: "CORS allows any origin. That is acceptable for a public, unauthenticated API; otherwise list the trusted origins, and never combine a wildcard or reflected origin with credentials."

  - id: ENTR-INNERHTML
    name: "Dynamic HTML Written to the DOM"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx"]
    target: all
    regions: code
    # Only dynamic right-hand sides count: string literals, static template
    # literals, clears (= "") and comparisons (==) are not reported.
    pattern: '\.(?:innerHTML|outerHTML)\s*\+?=\s*(?:[^\s"\x27\x60=]|\x60[^\x60]*\$\{|\x60[^\x60]*\x60\s*\+|"[^"\n]*"\s*\+|\x27[^\x27\n]*\x27\s*\+)|\.insertAdjacentHTML\s*\(\s*["\x27][^"\x27]+["\x27]\s*,\s*(?:[^\s"\x27\x60)]|\x60[^\x60]*\$\{|"[^"\n]*"\s*\+|\x27[^\x27\n]*\x27\s*\+)|\bdocument\.write(?:ln)?\s*\(\s*(?:[^\s"\x27\x60)]|\x60[^\x60]*\$\{|"[^"\n]*"\s*\+|\x27[^\x27\n]*\x27\s*\+)'
    severity: MEDIUM
    metadata:
      cwe: "CWE-79"
      owasp: "A05:2025"
      confidence: medium
      subcategory: audit
    suggestion: "A computed value is written to the DOM as HTML. Use textContent or DOM APIs for text, and pass HTML through a sanitizer such as DOMPurify before assigning it."

  - id: ENTR-EVAL-FUNC
    name: "Dynamic Code via new Function()"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx"]
    target: all
    regions: code
    exclude_tests: true
    # Calls with literal-only arguments, such as the globalThis polyfill
    # new Function("return this"), are not reported.
    pattern: '\bnew\s+Function\s*\(\s*(?:["\x27][^"\x27\n]*["\x27]\s*,\s*)*(?:[^"\x27\x60\s)]|\x60[^\x60]*\$\{|["\x27][^"\x27\n]*["\x27]\s*\+)'
    severity: HIGH
    metadata:
      cwe: "CWE-95"
      owasp: "A05:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "new Function() compiles a string built at runtime into code. Replace it with a lookup table or a safe expression parser; never pass request or user data into it."

  - id: ENTR-INSECURE-RANDOM
    name: "Insecure Randomness for a Secret Value"
    stack: universal
    extensions: [".ts", ".js", ".tsx", ".jsx", ".mjs", ".cjs"]
    target: all
    regions: code_and_strings
    exclude_tests: true
    exclude_paths: ["__mocks__/", ".stories.", "fixtures/"]
    # Reported only when the same statement, or the enclosing function name,
    # names a secret (token, password, OTP, nonce, session id, key, invite or
    # reset code). Math.random() for UI effects, shuffles or DOM ids is fine.
    pattern: '(?i)\w*(?:token|secret|passw(?:or)?d|\bpwd|nonce|salt|\botp|_otp|(?-i:[a-z]Otp|OTP)|csrf|xsrf|session_?(?:id|key|token|secret)|\bsid\b|api_?key|secret_?key|private_?key|signing_?key|auth_?code|invite|reset_?(?:token|code|key|link)|verification_?(?:code|token)|captcha|\bpin\b|_pin\b|(?-i:[a-z]Pin\b))\w*["\x27]?\s*(?:[:=]|\+=)[^;}\n]*\bMath\.random\s*\(\s*\)|\w*(?:token|secret|passw(?:or)?d|\bpwd|nonce|salt|\botp|_otp|(?-i:[a-z]Otp|OTP)|csrf|xsrf|session_?(?:id|key|token|secret)|\bsid\b|api_?key|secret_?key|private_?key|signing_?key|auth_?code|invite|reset_?(?:token|code|key|link)|verification_?(?:code|token)|captcha|\bpin\b|_pin\b|(?-i:[a-z]Pin\b))\w*\s*(?:\([^)]*\)\s*(?::\s*\w+\s*)?\{|=\s*(?:async\s*)?\([^)]*\)\s*(?::\s*\w+\s*)?=>\s*\{?)[^;}]*\bMath\.random\s*\(\s*\)'
    severity: HIGH
    metadata:
      cwe: "CWE-338"
      owasp: "A04:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "Math.random() generates a secret value here (token, password, code or key). Its output is predictable; use crypto.randomUUID() or crypto.getRandomValues() (crypto.randomBytes() in Node.js)."

  - id: ENTR-SENSITIVE-LOG
    name: "Secret Value Written to a Log"
    stack: universal
    # Python is owned by PY-LOGGING-SENSITIVE and C# by ASP-LOGGING-SENSITIVE.
    extensions: [".ts", ".js", ".tsx", ".jsx", ".mjs", ".cjs", ".go"]
    target: all
    regions: code
    exclude_tests: true
    # A secret-named variable must be an argument (or a ${...} interpolation)
    # of the log call; words inside the message text do not count.
    pattern: '(?i)(?:\bconsole\.(?:log|info|warn|error|debug|trace)|\b(?:logger|log|slog|logrus|winston|pino)\.(?:log|info\w*|warn\w*|error\w*|debug\w*|trace|fatal\w*|panic\w*|print\w*)|\bfmt\.Print(?:ln|f)?|\bprintln)\s*\((?:(?:[^"\x27\x60\n)]|"[^"\n]*"|\x27[^\x27\n]*\x27|\x60[^\x60\n]*\x60)*?[^\w"\x27\x60.])?(?:\w+\.)*\w*?(?:password|passwd|(?:access|refresh|auth|id|api|bearer|session|csrf)_?token|token|jwt|secret|client_?secret|api_?key|private_?key|bearer|authorization)\b\s*[,)+]|(?:\bconsole\.(?:log|info|warn|error|debug|trace)|\b(?:logger|log|slog|logrus|winston|pino)\.(?:log|info\w*|warn\w*|error\w*|debug\w*|trace|fatal\w*|panic\w*|print\w*))\s*\([^\n]*?\$\{\s*(?:\w+\.)*\w*?(?:password|passwd|(?:access|refresh|auth|id|api|bearer|session|csrf)_?token|token|jwt|secret|client_?secret|api_?key|private_?key|bearer|authorization)\b\s*\}'
    severity: MEDIUM
    metadata:
      cwe: "CWE-532"
      owasp: "A09:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "A password, token or key is passed to a log call. Logs are stored and shared widely; log an identifier or a masked value (for example the last 4 characters) instead."
