# ============================================================
# AITRIAGE RULES: FastAPI (Python) — Security
# ============================================================
# Regex/AST rules: CORS, debug mode, hardcoded secrets, CSRF,
# missing authentication/authorization/rate limiting, swallowed
# exceptions and blocking calls in async handlers.
#
# Semgrep taint rules (mode: taint, bottom of this file): reflected
# XSS, SQL injection, path traversal, SSRF and open redirect. The
# regex/AST engine skips them; the bundled Semgrep runs them from a
# trusted, compiled-in config during a full audit (rules/taint.go).
#
# Generic Python sinks (eval/exec, pickle, yaml.load, subprocess
# shell=True, tempfile.mktemp, template injection) are covered by the
# universal PY-* and FLASK-SSTI rules, which run on FastAPI projects.
# ============================================================

rules:
  # Retired: FAST-ORM — importing a database driver is not a vulnerability; FAST-SQLI covers SQL injection.
  # Retired: FAST-TEMPFILE — duplicate of the universal PY-TEMPFILE.
  # Retired: FAST-SUBPROCESS — duplicate of the universal PY-SUBPROCESS.
  # Retired: FAST-PICKLE — duplicate of the universal PY-PICKLE.
  # Retired: FAST-YAML — duplicate of the universal PY-YAML-LOAD.
  # Retired: FAST-EVAL — duplicate of the universal PY-EXEC.
  # Retired: FAST-SSTI — duplicate of the universal FLASK-SSTI.

  - id: FAST-LAZY-EXC
    name: "Exception Silently Swallowed"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code
    exclude_tests: true
    # A bare or broad except whose only statement is pass/... . Bandit rates
    # the same pattern LOW (B110): a reliability defect, not an exploitable flaw.
    pattern: '(?m)^[ \t]*except(?:\s+(?:Exception|BaseException)(?:\s+as\s+\w+)?)?\s*:[ \t]*(?:#[^\r\n]*)?\r?\n[ \t]*(?:pass|\.\.\.)[ \t]*(?:#[^\r\n]*)?\r?$'
    severity: LOW
    metadata:
      cwe: "CWE-703"
      owasp: "A10:2025"
      confidence: high
      subcategory: audit
    suggestion: "A broad except block that only passes hides failures, including security checks that raised. Catch the specific exception you expect, and log or re-raise everything else."

  - id: FAST-SYNC-ASYNC
    name: "Blocking Database Commit in Async Function"
    stack: fastapi
    extensions: [".py"]
    target: ast
    # A non-awaited .commit() directly in the body of an async def. Awaited
    # calls (AsyncSession) and work offloaded to a nested sync function or a
    # thread are not matched.
    pattern: |
      (function_definition
        "async"
        body: (block
          (expression_statement
            (call
              function: (attribute attribute: (identifier) @method)) @call))
        (#eq? @method "commit"))
    severity: LOW
    metadata:
      category: performance
      confidence: medium
      subcategory: audit
    suggestion: "A synchronous commit inside an async function blocks the event loop and stalls every other request. Use AsyncSession with await session.commit(), declare the route with def so FastAPI runs it in the threadpool, or wrap the call in run_in_threadpool()."

  - id: FAST-AUTH
    name: "No Authentication Mechanism Found"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code_and_strings
    condition: "required_pattern"
    pattern: '(?i)(OAuth2PasswordBearer|OAuth2AuthorizationCodeBearer|OpenIdConnect|HTTPBearer|HTTPBasic|HTTPDigest|APIKey(?:Header|Query|Cookie)|jwt\.decode|jwt\.verify|jwt_required|firebase_admin\.auth|verify_id_token|get_current_user|current_user|CurrentUser|AuthenticationMiddleware|AuthenticationBackend|fastapi_users|\bauthenticate\b|require_\w*(?:auth|session|login|user|token))'
    severity: MEDIUM
    metadata:
      cwe: "CWE-306"
      owasp: "A07:2025"
      confidence: low
      subcategory: policy
    suggestion: "No authentication dependency, security scheme or middleware was found in this project. If authentication is not done by a gateway in front of the service, protect non-public routes with a dependency such as OAuth2PasswordBearer, HTTPBearer or APIKeyHeader."

  - id: FAST-AUTHZ
    name: "No Authorization Check Found"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code
    condition: "required_pattern"
    pattern: '(Security\(|SecurityScopes|\b(?:require|check|has|verify|ensure)_(?:role|roles|permission|permissions|scope|scopes|admin|superuser)\b|\bis_(?:admin|superuser|staff)\b|get_current_active_superuser|\.roles?\b|\.permissions\b|\.scopes\b)'
    severity: LOW
    metadata:
      cwe: "CWE-862"
      owasp: "A01:2025"
      confidence: low
      subcategory: policy
    suggestion: "No role, permission or scope check was found in this project. If users differ in what they may do, check it on the server in a dependency (for example Security() with SecurityScopes, or a require_role() dependency) and verify object ownership before returning or changing a record."

  - id: FAST-RATELIMIT
    name: "No Rate Limiter Found"
    stack: fastapi
    extensions: [".py", ".txt", ".toml", ".cfg", "Pipfile"]
    target: all
    regions: code_and_strings
    condition: "required_pattern"
    # "limiter" is matched as a word: inside "delimiter" (csv.reader(...,
    # delimiter=";")) it says nothing about rate limiting.
    pattern: '(?i)(slowapi|fastapi[-_]limiter|\blimiter\b|ratelimit|rate_limit|throttl)'
    severity: MEDIUM
    metadata:
      cwe: "CWE-770"
      owasp: "A06:2025"
      confidence: low
      subcategory: policy
    suggestion: "No rate-limiting library or middleware was found. If no gateway limits requests in front of the service, add one (for example slowapi or fastapi-limiter) at least on login, password reset and other expensive endpoints."

  - id: FAST-CSRF
    name: "Cookie Session Without CSRF Check"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code
    # set_cookie() on a response object (not a service wrapper of the same
    # name), SessionMiddleware, or request.session. A file that validates a
    # CSRF token or sets SameSite explicitly to strict or lax is skipped.
    pattern: '\b(?:\w*_)?(?:response|resp|res|r)\.set_cookie\s*\(|\b(?:add_middleware|Middleware)\s*\(\s*SessionMiddleware\b|\brequest\.session\b'
    condition: "not_contains:csrf|samesite=\"strict\"|samesite='strict'|samesite=\"lax\"|samesite='lax'|same_site=\"strict\"|same_site=\"lax\""
    severity: MEDIUM
    metadata:
      cwe: "CWE-352"
      owasp: "A01:2025"
      confidence: low
      subcategory: audit
    suggestion: "This file sets a cookie or uses a cookie session without a CSRF check or an explicit SameSite policy. If the cookie authenticates requests, set samesite=\"lax\" or \"strict\" explicitly, never change state in GET routes, and validate a CSRF token (for example with fastapi-csrf-protect) on state-changing routes."

  - id: FAST-CORS-WILDCARD
    name: "CORS Allows Any Origin"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code
    pattern: 'allow_origins\s*=\s*(?:[\[(]\s*["'']\*["'']\s*,?\s*[\])]|["'']\*["''])|allow_origin_regex\s*=\s*[rR]?["'']\.[*+]["'']'
    # With credentials enabled the same setting is reported by FAST-CORS-CREDENTIALS.
    pattern-not: 'allow_credentials\s*=\s*True'
    severity: MEDIUM
    metadata:
      cwe: "CWE-942"
      owasp: "A02:2025"
      confidence: high
      subcategory: audit
    suggestion: "CORS allows every origin. This is fine for a public, unauthenticated API; otherwise list the trusted origins explicitly in allow_origins."

  - id: FAST-CORS-CREDENTIALS
    name: "CORS Allows Any Origin With Credentials"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code
    # Starlette's CORSMiddleware reflects the request Origin when allow_origins
    # is "*" (or the regex matches everything) and allow_credentials=True, so
    # any site can make credentialed requests and read the responses.
    pattern: '(?:allow_origins\s*=\s*(?:[\[(]\s*["'']\*["'']\s*,?\s*[\])]|["'']\*["''])|allow_origin_regex\s*=\s*[rR]?["'']\.[*+]["''])(?:[^()]|\([^()]*\))*?allow_credentials\s*=\s*True|allow_credentials\s*=\s*True(?:[^()]|\([^()]*\))*?(?:allow_origins\s*=\s*(?:[\[(]\s*["'']\*["'']\s*,?\s*[\])]|["'']\*["''])|allow_origin_regex\s*=\s*[rR]?["'']\.[*+]["''])'
    severity: HIGH
    metadata:
      cwe: "CWE-942"
      owasp: "A02:2025"
      confidence: high
      subcategory: vuln
    suggestion: "With allow_credentials=True, Starlette echoes back any Origin when allow_origins is \"*\", so every website can send authenticated requests and read the responses. List the trusted origins explicitly, or set allow_credentials=False for a public API."

  - id: FAST-DEBUG
    name: "Debug Mode Enabled"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code
    pattern: '\b(?:FastAPI|Starlette)\s*\((?:[^()]|\([^()]*\))*?\bdebug\s*=\s*True\b'
    severity: HIGH
    metadata:
      cwe: "CWE-489"
      owasp: "A02:2025"
      confidence: high
      subcategory: vuln
    suggestion: "debug=True makes the application return full tracebacks, with source lines and local values, to any client that triggers an error. Read the flag from the environment with a False default."

  - id: FAST-HARDCODED-SECRET
    name: "Hardcoded Secret Key"
    stack: fastapi
    extensions: [".py"]
    target: all
    regions: code
    exclude_tests: true
    # Plain assignments and pydantic-settings fields with a literal default
    # (SECRET_KEY: str = "...").
    pattern: '(?im)^[ \t]*(?:secret_key|jwt_secret(?:_key)?|signing_key|api_key|access_token_secret|session_secret)\s*(?::\s*[\w\[\]., |]+?)?\s*=\s*[rbuRBU]?["''][^"''\n]{8,}["'']'
    severity: HIGH
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2025"
      confidence: medium
      subcategory: vuln
    suggestion: "A secret is written in the source. Read it from the environment or a secret manager (for example a pydantic-settings field without a default), and rotate the value that was committed."

  # ------------------------------------------------------------
  # Semgrep taint rules (mode: taint)
  # ------------------------------------------------------------
  # These are NOT executed by the AITriage regex/AST engine; the engine skips
  # them and the bundled Semgrep runs them from a trusted, compiled-in config
  # during a full audit. Semgrep options that a rule needs (such as
  # taint_assume_safe_functions) are set in rules/taint.go.
  #
  # All five share one source list, defined once under FAST-XSS
  # (&fastapi_request_sources) and reused with a YAML alias: parameters of a
  # route handler (an @app/@router decorator with an HTTP verb), except
  # dependencies, framework objects and scalar-typed parameters (int, float,
  # bool, UUID, date, datetime, Decimal), plus request.query_params,
  # path_params, form(), json(), body(), cookies and headers. Semgrep OSS
  # taint tracking is intraprocedural: a value passed to a helper function is
  # not followed into it.

  # FAST-XSS: untrusted input reaches an HTML response. Rendering through an
  # autoescaping template (Jinja2Templates.TemplateResponse, get_template()
  # .render(), or a project helper named render/_render_*) counts as escaping;
  # Template(...).render and from_string(...).render do not.
  - id: FAST-XSS
    name: "Reflected Cross-Site Scripting (XSS)"
    stack: fastapi
    extensions: [".py"]
    severity: HIGH
    mode: taint
    languages: [python]
    message: "Untrusted FastAPI request input reaches an HTML response without escaping. Escape the value with html.escape()/markupsafe.escape() or render it through an autoescaping template."
    suggestion: "Untrusted FastAPI request input reaches an HTML response without escaping. Escape the value with html.escape()/markupsafe.escape() or render it through an autoescaping template."
    metadata:
      cwe: "CWE-79"
      owasp: "A05:2025"
      confidence: medium
      subcategory: vuln
    pattern-sources: &fastapi_request_sources
      # Route-handler parameters (sync + async): FastAPI binds path/query params
      # and Query()/Path()/Form()/Body() defaults to these.
      - patterns:
          - pattern: $P
          - focus-metavariable: $P
          - pattern-not-inside: |
              def $F(..., $P = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P = Security(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $T = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $T = Security(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $ANN[..., Depends(...)], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $ANN[..., Security(...)], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Request, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Response, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: BackgroundTasks, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: WebSocket, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: int, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: int = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[int, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[int, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: float, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: float = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[float, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[float, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: bool, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: bool = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[bool, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[bool, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: UUID, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: UUID = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[UUID, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[UUID, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: uuid.UUID, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: uuid.UUID = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[uuid.UUID, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[uuid.UUID, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: date, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: date = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[date, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[date, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: datetime, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: datetime = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[datetime, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[datetime, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Decimal, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Decimal = $D, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[Decimal, ...], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Annotated[Decimal, ...] = $D, ...):
                  ...
          - pattern-inside: |
              def $F(..., $P, ...):
                  ...
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(...):
                  ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|head|options|trace|api_route|route|websocket)$
      - patterns:
          - pattern: $P
          - focus-metavariable: $P
          - pattern-not-inside: |
              async def $F(..., $P = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P = Security(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $T = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $T = Security(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $ANN[..., Depends(...)], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $ANN[..., Security(...)], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Request, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Response, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: BackgroundTasks, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: WebSocket, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: int, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: int = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[int, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[int, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: float, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: float = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[float, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[float, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: bool, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: bool = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[bool, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[bool, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: UUID, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: UUID = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[UUID, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[UUID, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: uuid.UUID, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: uuid.UUID = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[uuid.UUID, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[uuid.UUID, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: date, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: date = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[date, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[date, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: datetime, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: datetime = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[datetime, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[datetime, ...] = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Decimal, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Decimal = $D, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[Decimal, ...], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Annotated[Decimal, ...] = $D, ...):
                  ...
          - pattern-inside: |
              async def $F(..., $P, ...):
                  ...
          - pattern-inside: |
              @$APP.$METHOD(...)
              async def $F(...):
                  ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|head|options|trace|api_route|route|websocket)$
      # Raw request accessors.
      - pattern: $REQ.query_params
      - pattern: $REQ.path_params
      - pattern: $REQ.query_params.get(...)
      - pattern: $REQ.path_params.get(...)
      - pattern: await $REQ.form()
      - pattern: await $REQ.json()
      - pattern: await $REQ.body()
      # Cookies and headers only on a request-like object, so an outbound
      # response's headers (resp.headers) are not treated as user input.
      - patterns:
          - pattern-either:
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
              - pattern: $REQ.cookies.get(...)
              - pattern: $REQ.headers.get(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req|websocket|ws|connection)$
    pattern-sanitizers:
      - pattern: html.escape(...)
      - pattern: markupsafe.escape(...)
      # Autoescaping template rendering and project render helpers.
      - pattern: $TEMPLATES.TemplateResponse(...)
      - pattern: $ENV.get_template(...).render(...)
      - patterns:
          - pattern-either:
              - pattern: $RENDER(...)
              - pattern: $OBJ.$RENDER(...)
          - pattern-not: $ENV.from_string(...).render(...)
          - pattern-not: Template(...).render(...)
          - pattern-not: jinja2.Template(...).render(...)
          - metavariable-regex:
              metavariable: $RENDER
              regex: ^_*render(_\w+)?$
    pattern-sinks:
      # Only the body of an HTMLResponse, not status_code or headers.
      - patterns:
          - pattern-either:
              - pattern: HTMLResponse($CONTENT, ...)
              - pattern: HTMLResponse(..., content=$CONTENT, ...)
          - focus-metavariable: $CONTENT
      - pattern: Markup(...)
      - pattern: markupsafe.Markup(...)
      - patterns:
          - pattern: Response(..., media_type=$MEDIA_TYPE, ...)
          - metavariable-regex:
              metavariable: $MEDIA_TYPE
              regex: '(?i)["'']text/html(?:\s*;[^"'']*)?["'']'
      - patterns:
          - pattern: return $BODY
          - pattern-not: return HTMLResponse(...)
          - pattern-not: return Response(...)
          - focus-metavariable: $BODY
          - pattern-inside: |
              @$APP.$METHOD(..., response_class=HTMLResponse, ...)
              def $F(...):
                  ...
      - patterns:
          - pattern: return $BODY
          - pattern-not: return HTMLResponse(...)
          - pattern-not: return Response(...)
          - focus-metavariable: $BODY
          - pattern-inside: |
              @$APP.$METHOD(..., response_class=HTMLResponse, ...)
              async def $F(...):
                  ...

  # FAST-SQLI: request input is built into a SQL statement with an f-string,
  # +, % or .format(). A value converted with int() is treated as safe.
  - id: FAST-SQLI
    name: "SQL Injection"
    stack: fastapi
    extensions: [".py"]
    severity: HIGH
    mode: taint
    languages: [python]
    message: "Request input is built into a SQL statement. Pass values as bound parameters (text(\"... WHERE name = :name\") with a dict, or the driver's placeholders) instead of formatting them into the string."
    suggestion: "Request input is built into a SQL statement. Pass values as bound parameters (text(\"... WHERE name = :name\") with a dict, or the driver's placeholders) instead of formatting them into the string. Identifiers such as column names must come from an allowlist."
    metadata:
      cwe: "CWE-89"
      owasp: "A05:2025"
      confidence: medium
      subcategory: vuln
    pattern-sources: *fastapi_request_sources
    pattern-sanitizers:
      - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '"$SQLSTR" + $EXPR'
              - pattern: '"$SQLSTR" % $EXPR'
              - pattern: '"$SQLSTR".format(...)'
              - pattern: 'f"$SQLSTR{...}..."'
          - metavariable-regex:
              metavariable: $SQLSTR
              regex: (?is)^\s*(select\s.+\sfrom|insert\s+into|update\s+\S+\s+set|delete\s+from)\b

  # FAST-PATH-TRAVERSAL: request input reaches a filesystem path. basename(),
  # secure_filename(), uuid4() and a prior is_relative_to() check count as safe.
  - id: FAST-PATH-TRAVERSAL
    name: "Path Traversal"
    stack: fastapi
    extensions: [".py"]
    severity: HIGH
    mode: taint
    languages: [python]
    message: "Request input reaches a filesystem path, so ../ sequences or an absolute path can read, overwrite or delete files outside the intended directory."
    suggestion: "Request input reaches a filesystem path. Keep only the file name (os.path.basename) or resolve the path and check it with Path.is_relative_to(base_dir) before opening, serving or deleting it."
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2025"
      confidence: medium
      subcategory: vuln
    pattern-sources: *fastapi_request_sources
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: secure_filename(...)
      - pattern: uuid.uuid4(...)
      - by-side-effect: true
        patterns:
          - pattern: $X.is_relative_to(...)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: aiofiles.open($PATH, ...)
              - pattern: FileResponse($PATH, ...)
              - pattern: FileResponse(..., path=$PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: shutil.rmtree($PATH, ...)
              - pattern: shutil.copy($PATH, ...)
              - pattern: pathlib.Path($PATH).$METHOD(...)
              - pattern: Path($PATH).$METHOD(...)
          - focus-metavariable: $PATH

  # FAST-SSRF: request input controls the URL of an outbound HTTP request.
  # A URL whose host was checked with `if <url...> not in ALLOWED:` counts as
  # safe from that point on.
  - id: FAST-SSRF
    name: "Server-Side Request Forgery (SSRF)"
    stack: fastapi
    extensions: [".py"]
    severity: HIGH
    mode: taint
    languages: [python]
    message: "Request input controls the URL of an outbound HTTP request, so a caller can make the server reach internal services or cloud metadata endpoints."
    suggestion: "Request input controls the URL of an outbound HTTP request. Check the scheme and host against an allowlist before the request, and block private and link-local addresses after DNS resolution."
    metadata:
      cwe: "CWE-918"
      owasp: "A01:2025"
      confidence: medium
      subcategory: vuln
    pattern-sources: *fastapi_request_sources
    pattern-sanitizers:
      - patterns:
          - pattern-inside: |
              if <... $URL ...> not in $ALLOWED:
                  ...
              ...
          - pattern: $URL
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$M($URL, ...)
              - pattern: requests.request($METH, $URL, ...)
              - pattern: httpx.$M($URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern: $CLIENT.get($URL, ...)
                      - pattern: $CLIENT.post($URL, ...)
                      - pattern: $CLIENT.put($URL, ...)
                      - pattern: $CLIENT.patch($URL, ...)
                      - pattern: $CLIENT.delete($URL, ...)
                      - pattern: $CLIENT.head($URL, ...)
                      - pattern: $CLIENT.request($METH, $URL, ...)
                      - pattern: $CLIENT.stream($METH, $URL, ...)
                  # An HTTP client object (client, http, self._session, ...),
                  # not dict.get() or cache.get().
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: (?i)^(\w+\.)*_?\w*(client|session|http)$
          - pattern-either:
              - pattern-inside: |
                  import $LIB
                  ...
              - pattern-inside: |
                  from $LIB import $NAME
                  ...
          - metavariable-regex:
              metavariable: $LIB
              regex: ^(requests|httpx|aiohttp|urllib\.request|urllib3)$
          - focus-metavariable: $URL

  # FAST-OPEN-REDIRECT: request input controls a redirect target. url_for()
  # and a check with an is_safe/allowed-host style function count as safe.
  - id: FAST-OPEN-REDIRECT
    name: "Open Redirect"
    stack: fastapi
    extensions: [".py"]
    severity: MEDIUM
    mode: taint
    languages: [python]
    message: "Request input controls a redirect target, so a link to this site can send users to an attacker's site."
    suggestion: "Request input controls a redirect target. Redirect only to relative paths or to hosts on an allowlist, or map a short key to a fixed URL; build internal targets with url_for()."
    metadata:
      cwe: "CWE-601"
      owasp: "A01:2025"
      confidence: medium
      subcategory: vuln
    pattern-sources: *fastapi_request_sources
    pattern-sanitizers:
      - pattern: $REQ.url_for(...)
      - pattern: url_for(...)
      # A value checked with an is_safe_url()-style function, either before
      # the redirect (if not check(x): ...) or around it (if check(x): ...).
      # Route parameters are matched as sources at every use, so a
      # by-side-effect sanitizer would not stick; a guarded region does.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if not $CHECK(..., <... $URL ...>, ...):
                      ...
                  ...
              - pattern-inside: |
                  if $CHECK(..., <... $URL ...>, ...):
                      ...
              - pattern-inside: |
                  if not $CHECK(..., $KW=<... $URL ...>, ...):
                      ...
                  ...
              - pattern-inside: |
                  if $CHECK(..., $KW=<... $URL ...>, ...):
                      ...
          - pattern: $URL
          - metavariable-regex:
              metavariable: $CHECK
              regex: (?i).*(is_safe|safe_url|allowed_host|valid_redirect|validate_redirect)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: RedirectResponse($URL, ...)
              - pattern: RedirectResponse(..., url=$URL, ...)
          - focus-metavariable: $URL
