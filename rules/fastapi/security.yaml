# ============================================================
# AITRIAGE RULES: FastAPI (Python) — Security
# ============================================================
# Covers: SQLi, SSTI, eval/exec, CSRF, auth, CORS,
# rate limiting, validation, error handling, secrets,
# and sync-in-async anti-patterns.
# ============================================================

rules:
  - id: FAST-LAZY-EXC
    name: "Lazy Exception Handling"
    stack: fastapi
    extensions: [".py"]
    target: all
    exclude_tests: true
    pattern: 'except\s+Exception(?:\s+as\s+\w+)?:\s*\n\s*pass\s*(?:#.*)?\n'
    # LOW, as Bandit rates the same pattern (B110 try_except_pass): swallowing
    # errors is a reliability defect (CWE-703), not an exploitable flaw.
    severity: LOW
    suggestion: "Blanket except:pass silently swallows errors. Log the exception or re-raise."

  - id: FAST-SYNC-ASYNC
    name: "Sync in Async Check"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: 'async\s+def\s+\w+.*:\s*\n(?:\s*.*\n)*\s*\w+\.commit\(\)'
    severity: CRITICAL
    suggestion: "Blocking db commit found inside async route handler."

  - id: FAST-SQLI
    name: "SQL Injection Risk"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: '(?i)(db\.execute|conn\.execute).*f".*\{.*\}'
    severity: CRITICAL
    suggestion: "Raw SQL interpolation detected. Use parameterized queries."

  - id: FAST-PATH-TRAVERSAL
    name: "Path Traversal Risk"
    stack: fastapi
    extensions: [".py"]
    target: ast
    pattern: |
      (call
        function: (identifier) @func
        arguments: (argument_list
          (string
            (interpolation)))
        (#eq? @func "open"))
    severity: CRITICAL
    suggestion: "f-strings inside `open()` enable Path Traversal attacks."

  - id: FAST-EVAL
    name: "Dangerous Eval/Exec"
    stack: fastapi
    extensions: [".py"]
    target: ast
    pattern: |
      (call
        function: (identifier) @func_name
        arguments: (argument_list (_) @arg)
        (#match? @func_name "^(eval|exec)$"))
    severity: CRITICAL
    suggestion: "Dynamic code execution via `eval` or `exec`. High risk of Shell Injection."

  - id: FAST-SSTI
    name: "Server-Side Template Injection"
    stack: fastapi
    extensions: [".py"]
    target: ast
    pattern: |
      (call
        function: (attribute
          object: (call
            function: [
              (identifier) @template_func
              (attribute attribute: (identifier) @template_func)
            ]
          )
          attribute: (identifier) @render_func)
        (#match? @template_func "^(Template|Environment|from_string)$")
        (#eq? @render_func "render"))
    severity: CRITICAL
    suggestion: "Template(user_input).render() — classic SSTI. Never pass user-controlled data to template constructors."

  - id: FAST-AUTH
    name: "Missing Authentication"
    stack: fastapi
    extensions: [".py"]
    target: all
    condition: "required_pattern"
    pattern: '(?i)(OAuth2PasswordBearer|HTTPBearer|HTTPBasic|APIKeyHeader|APIKeyQuery|jwt\.decode|jwt\.verify|firebase_admin\.auth|verify_id_token|get_current_user|CurrentUser)'
    severity: HIGH
    suggestion: "No authentication mechanisms found."

  - id: FAST-AUTHZ
    name: "Missing Authorization"
    stack: fastapi
    extensions: [".py"]
    target: all
    condition: "required_pattern"
    pattern: '(?i)(Security\(|\bRole\b|\bpermission\b|\bscope\b|is_admin|require_role|check_permission|get_current_active_user|CurrentUser|current_user)'
    severity: HIGH
    suggestion: "No authorization mechanisms found."

  - id: FAST-RATELIMIT
    name: "Missing Rate Limiting"
    stack: fastapi
    extensions: [".py", ".txt"]
    target: raw
    condition: "required_pattern"
    pattern: '(?i)(slowapi|Limiter)'
    severity: HIGH
    suggestion: "No rate limiter dependency."

  - id: FAST-ORM
    name: "Raw Database Access Without ORM"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: '(?i)\b(sqlite3|psycopg|asyncpg|pymysql|mysql\.connector|pymongo|motor)\b'
    condition: "not_contains:sqlalchemy"
    severity: HIGH
    suggestion: "Database driver detected without an ORM. Use parameterized queries or an ORM; do not interpolate untrusted SQL."

  - id: FAST-CSRF
    name: "Missing CSRF Protection"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: '(?i)(set_cookie|SessionMiddleware|request\.session|response\.set_cookie)'
    condition: "not_contains:csrf"
    severity: HIGH
    suggestion: "Cookie/session authentication detected without CSRF protection. Validate an origin-bound CSRF token for state-changing requests."

  - id: FAST-SSRF
    name: "SSRF Risk"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: '(?i)(?:httpx|aiohttp|requests)\.(get|post|put|delete)\s*\(\s*(?:request\.|params|query)'
    severity: HIGH
    suggestion: "User-controlled URL in HTTP request. Validate against an allowlist."

  - id: FAST-PICKLE
    name: "Insecure Deserialization"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: '(?i)(pickle\.loads?\(|joblib\.load\()'
    severity: CRITICAL
    suggestion: "pickle/joblib deserialization of untrusted data enables RCE. Use JSON."

  - id: FAST-SUBPROCESS
    name: "Unsafe Subprocess"
    stack: fastapi
    extensions: [".py"]
    target: all
    exclude_tests: true
    pattern: 'subprocess\.\w+\(.*shell\s*=\s*True'
    severity: CRITICAL
    suggestion: "subprocess with shell=True enables command injection. Use shell=False with argument list."

  - id: FAST-YAML
    name: "Unsafe YAML Load"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: 'yaml\.load\s*\('
    condition: "not_contains:SafeLoader"
    severity: CRITICAL
    suggestion: "yaml.load() without SafeLoader enables arbitrary code execution. Use yaml.safe_load()."

  - id: FAST-CORS-WILDCARD
    name: "CORS Allow All Origins"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: 'allow_origins\s*=\s*\[\s*"\*"\s*\]'
    severity: HIGH
    suggestion: "CORS configured to allow all origins. Restrict to specific trusted domains."

  - id: FAST-HARDCODED-SECRET
    name: "Hardcoded Secret Key"
    stack: fastapi
    extensions: [".py"]
    target: all
    exclude_tests: true
    pattern: "(?i)(?:secret_key|jwt_secret|api_key)\\s*[:=]\\s*['\"][^'\"]{8,}['\"]"
    condition: "not_contains:os.environ"
    severity: CRITICAL
    suggestion: "Secret hardcoded. Load from pydantic-settings or environment variable."

  - id: FAST-OPEN-REDIRECT
    name: "Open Redirect"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: '(?i)RedirectResponse\s*\(\s*(?:request\.|url\s*=\s*(?:query|params))'
    severity: HIGH
    suggestion: "User-controlled redirect URL. Validate against an allowlist."

  - id: FAST-TEMPFILE
    name: "Insecure Temp File"
    stack: fastapi
    extensions: [".py"]
    target: all
    pattern: 'tempfile\.mktemp\s*\('
    severity: MEDIUM
    suggestion: "tempfile.mktemp() is vulnerable to race conditions. Use tempfile.mkstemp()."

  # FAST-XSS is a Semgrep taint-mode rule (mode: taint). It is NOT executed by the
  # AITriage regex/AST engine; the engine skips it and the bundled Semgrep runs it
  # from a trusted, compiled-in config during a full audit. It tracks untrusted
  # FastAPI input from route parameters / Query / Path / Form / Body /
  # request.query_params / request.path_params to an HTML response sink, through
  # local variables, f-strings, .format() and %-formatting, and is neutralized by
  # html.escape / markupsafe.escape.
  - id: FAST-XSS
    name: "Reflected Cross-Site Scripting (XSS)"
    stack: fastapi
    extensions: [".py"]
    severity: HIGH
    mode: taint
    languages: [python]
    message: "HIGH: Reflected XSS — untrusted FastAPI request input reaches an HTML response without escaping. Wrap the value in html.escape()/markupsafe.escape() or render via an autoescaping template."
    suggestion: "Reflected XSS — untrusted FastAPI request input reaches an HTML response without escaping. Wrap the value in html.escape()/markupsafe.escape() or render via an autoescaping template."
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp: "A05:2025 - Injection"
    pattern-sources:
      # Route-handler parameters (sync + async): FastAPI binds path/query params
      # and Query()/Path()/Form()/Body() defaults to these.
      - patterns:
          - pattern: $P
          - focus-metavariable: $P
          - pattern-not-inside: |
              def $F(..., $P = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P = Security(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $T = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $T = Security(...), ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $ANN[..., Depends(...)], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: $ANN[..., Security(...)], ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Request, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: Response, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: BackgroundTasks, ...):
                  ...
          - pattern-not-inside: |
              def $F(..., $P: WebSocket, ...):
                  ...
          - pattern-inside: |
              def $F(..., $P, ...):
                  ...
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(...):
                  ...
      - patterns:
          - pattern: $P
          - focus-metavariable: $P
          - pattern-not-inside: |
              async def $F(..., $P = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P = Security(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $T = Depends(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $T = Security(...), ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $ANN[..., Depends(...)], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: $ANN[..., Security(...)], ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Request, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: Response, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: BackgroundTasks, ...):
                  ...
          - pattern-not-inside: |
              async def $F(..., $P: WebSocket, ...):
                  ...
          - pattern-inside: |
              async def $F(..., $P, ...):
                  ...
          - pattern-inside: |
              @$APP.$METHOD(...)
              async def $F(...):
                  ...
      # Raw request accessors.
      - pattern: $REQ.query_params
      - pattern: $REQ.path_params
      - pattern: $REQ.query_params.get(...)
      - pattern: $REQ.path_params.get(...)
    pattern-sanitizers:
      - pattern: html.escape(...)
      - pattern: markupsafe.escape(...)
    pattern-sinks:
      - pattern: HTMLResponse(...)
      - patterns:
          - pattern: Response(..., media_type=$MEDIA_TYPE, ...)
          - metavariable-regex:
              metavariable: $MEDIA_TYPE
              regex: '(?i)["'']text/html(?:\s*;[^"'']*)?["'']'
      - patterns:
          - pattern: return $BODY
          - focus-metavariable: $BODY
          - pattern-inside: |
              @$APP.$METHOD(..., response_class=HTMLResponse, ...)
              def $F(...):
                  ...
      - patterns:
          - pattern: return $BODY
          - focus-metavariable: $BODY
          - pattern-inside: |
              @$APP.$METHOD(..., response_class=HTMLResponse, ...)
              async def $F(...):
                  ...
